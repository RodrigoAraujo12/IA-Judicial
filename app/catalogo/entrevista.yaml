# Roteiro de entrevista. A ordem e a de uma conversa real com o cliente,
# nao a ordem do codigo. `mostrar_se` segue a mesma gramatica de `quando`.

secoes:
  - id: contrato
    titulo: Contrato de trabalho
    ordem: 1
  - id: jornada
    titulo: Jornada
    ordem: 2
  - id: condicoes
    titulo: Condicoes de trabalho
    ordem: 3
  - id: funcao
    titulo: Funcao e salario
    ordem: 4
  - id: rescisao
    titulo: Rescisao e verbas
    ordem: 5
  - id: danos
    titulo: Saude e danos
    ordem: 6
  - id: fatos
    titulo: Historia dos fatos
    ordem: 7
  - id: qualificacao
    titulo: Qualificacao das partes
    ordem: 8
  - id: processual
    titulo: Dados processuais
    ordem: 9

perguntas:
  # --- contrato -------------------------------------------------------------
  - id: data_admissao
    secao: contrato
    texto: Data de admissao
    tipo: data
    obrigatoria: true
    ajuda: Se nao havia registro, use a data em que comecou a trabalhar de fato.

  - id: data_saida
    secao: contrato
    texto: Data de saida
    tipo: data
    obrigatoria: true
    ajuda: Ultimo dia efetivamente trabalhado ou fim do aviso previo.

  - id: funcao
    secao: contrato
    texto: Funcao exercida
    tipo: texto
    obrigatoria: true
    ajuda: A funcao REAL, nao necessariamente a anotada na CTPS.

  - id: salario_base
    secao: contrato
    texto: Ultimo salario base
    tipo: moeda
    obrigatoria: true

  - id: local_prestacao
    secao: contrato
    texto: Municipio onde os servicos eram prestados
    tipo: texto
    obrigatoria: true
    ajuda: Define a competencia territorial (art. 651 da CLT).

  - id: registro_ctps
    secao: contrato
    texto: Havia registro em CTPS durante todo o periodo?
    tipo: bool
    obrigatoria: true

  - id: vinculo_negado
    secao: contrato
    texto: A empresa tratava a relacao como PJ, autonomo, cooperado ou informal?
    tipo: bool
    mostrar_se:
      - - campo: registro_ctps
          op: falso

  - id: empresa_mais_20_empregados
    secao: contrato
    texto: A empresa tinha mais de 20 empregados?
    tipo: bool
    ajuda: >-
      Acima de 20, o controle de jornada e obrigatorio (art. 74, par. 2o).
      Abaixo disso, a Sumula 338 nao se aplica da mesma forma.

  - id: empresa_ativa
    secao: contrato
    texto: A empresa continua em atividade?
    tipo: bool
    ajuda: >-
      Empresa baixada antecipa o problema de execucao. Ja levantar socios e
      eventual grupo economico.

  # --- jornada --------------------------------------------------------------
  - id: jornada_contratual
    secao: jornada
    texto: Qual era a jornada contratual?
    tipo: escolha
    opcoes:
      - { valor: "44h", rotulo: "44h semanais (8h/dia)" }
      - { valor: "40h", rotulo: "40h semanais" }
      - { valor: "36h", rotulo: "36h semanais" }
      - { valor: "12x36", rotulo: "12x36" }
      - { valor: "outra", rotulo: "Outra" }

  - id: horas_extras_habituais
    secao: jornada
    texto: Trabalhava habitualmente alem da jornada contratual?
    tipo: bool
    obrigatoria: true

  - id: horas_extras_pagas
    secao: jornada
    texto: As horas extras eram pagas corretamente nos contracheques?
    tipo: bool
    mostrar_se:
      - - campo: horas_extras_habituais
          op: verdadeiro

  - id: controle_ponto
    secao: jornada
    texto: Como era o registro de ponto?
    tipo: escolha
    opcoes:
      - { valor: "sim_fidedigno", rotulo: "Havia registro e refletia a jornada real" }
      - { valor: "sim_britanico", rotulo: "Havia registro, mas com horarios invariaveis (ponto britanico)" }
      - { valor: "nao_havia", rotulo: "Nao havia registro" }
      - { valor: "nao_recebeu_copia", rotulo: "Havia, mas o trabalhador nunca teve copia" }
    ajuda: >-
      Ponto britanico e a porta de entrada para a invalidacao dos controles e a
      inversao do onus da prova.

  - id: intervalo_gozado
    secao: jornada
    texto: Como era o intervalo para almoco e descanso?
    tipo: escolha
    opcoes:
      - { valor: "integral", rotulo: "Gozava integralmente (1h ou mais)" }
      - { valor: "parcial", rotulo: "Gozava parcialmente (menos de 1h)" }
      - { valor: "nenhum", rotulo: "Nao gozava" }

  - id: interjornada_violada
    secao: jornada
    texto: Chegava a ter menos de 11 horas de descanso entre uma jornada e outra?
    tipo: bool
    ajuda: Tipico em escalas, plantoes e virada de turno.

  - id: trabalho_noturno
    secao: jornada
    texto: Trabalhava entre 22h e 5h?
    tipo: bool

  # --- condicoes ------------------------------------------------------------
  - id: exposicao_agente_nocivo
    secao: condicoes
    texto: Trabalhava exposto a agente nocivo a saude?
    tipo: bool
    ajuda: Ruido, calor, frio, umidade, agentes quimicos, biologicos, poeira.

  - id: agente_nocivo
    secao: condicoes
    texto: Quais agentes?
    tipo: multipla
    opcoes:
      - { valor: "ruido", rotulo: "Ruido" }
      - { valor: "calor", rotulo: "Calor ou frio" }
      - { valor: "quimicos", rotulo: "Agentes quimicos" }
      - { valor: "biologicos", rotulo: "Agentes biologicos" }
      - { valor: "umidade", rotulo: "Umidade" }
      - { valor: "poeira", rotulo: "Poeira mineral" }
    mostrar_se:
      - - campo: exposicao_agente_nocivo
          op: verdadeiro

  - id: epi_fornecido
    secao: condicoes
    texto: A empresa fornecia EPI?
    tipo: escolha
    opcoes:
      - { valor: "nao", rotulo: "Nao fornecia" }
      - { valor: "sim_sem_fiscalizacao", rotulo: "Fornecia, mas nao fiscalizava nem repunha" }
      - { valor: "sim_com_fiscalizacao", rotulo: "Fornecia, fiscalizava e repunha com registro" }
    mostrar_se:
      - - campo: exposicao_agente_nocivo
          op: verdadeiro
    ajuda: >-
      Sumula 289 do TST: fornecer nao basta, e preciso fiscalizar o uso. Esta e a
      pergunta que decide o pedido de insalubridade.

  - id: adicional_insalubridade_pago
    secao: condicoes
    texto: Recebia adicional de insalubridade?
    tipo: bool
    mostrar_se:
      - - campo: exposicao_agente_nocivo
          op: verdadeiro

  - id: exposicao_perigo
    secao: condicoes
    texto: Trabalhava exposto a condicao de risco acentuado?
    tipo: bool
    ajuda: Inflamaveis, explosivos, energia eletrica, radiacao, motocicleta, seguranca patrimonial.

  - id: tipo_perigo
    secao: condicoes
    texto: Qual o tipo de risco?
    tipo: multipla
    opcoes:
      - { valor: "inflamaveis", rotulo: "Inflamaveis ou explosivos" }
      - { valor: "eletricidade", rotulo: "Energia eletrica" }
      - { valor: "radiacao", rotulo: "Radiacao ionizante" }
      - { valor: "motocicleta", rotulo: "Uso de motocicleta no trabalho" }
      - { valor: "seguranca", rotulo: "Seguranca pessoal ou patrimonial" }
    mostrar_se:
      - - campo: exposicao_perigo
          op: verdadeiro

  - id: adicional_periculosidade_pago
    secao: condicoes
    texto: Recebia adicional de periculosidade?
    tipo: bool
    mostrar_se:
      - - campo: exposicao_perigo
          op: verdadeiro

  - id: transferencia
    secao: condicoes
    texto: Houve transferencia com mudanca de domicilio?
    tipo: bool

  - id: transferencia_provisoria
    secao: condicoes
    texto: A transferencia era provisoria?
    tipo: bool
    mostrar_se:
      - - campo: transferencia
          op: verdadeiro

  # --- funcao ---------------------------------------------------------------
  - id: desvio_ou_acumulo
    secao: funcao
    texto: Exercia atribuicoes alem das da funcao contratada?
    tipo: escolha
    opcoes:
      - { valor: "nenhum", rotulo: "Nao" }
      - { valor: "desvio", rotulo: "Exercia funcao diversa da contratada (desvio)" }
      - { valor: "acumulo", rotulo: "Exercia duas ou mais funcoes ao mesmo tempo (acumulo)" }
      - { valor: "substituicao", rotulo: "Substituia outro empregado de forma nao eventual" }

  - id: paradigma_existe
    secao: funcao
    texto: Havia colega que fazia o mesmo servico e ganhava mais?
    tipo: bool

  - id: paradigma_mesma_funcao
    secao: funcao
    texto: Esse colega exercia exatamente as mesmas atribuicoes, no mesmo estabelecimento?
    tipo: bool
    mostrar_se:
      - - campo: paradigma_existe
          op: verdadeiro
    ajuda: >-
      Identidade de FUNCAO, nao de cargo. O paradigma precisa ser nomeado na
      inicial e ter testemunha que conheca as duas rotinas.

  # --- rescisao -------------------------------------------------------------
  - id: modalidade_saida
    secao: rescisao
    texto: Como terminou o contrato?
    tipo: escolha
    obrigatoria: true
    opcoes:
      - { valor: "sem_justa_causa", rotulo: "Dispensa sem justa causa" }
      - { valor: "justa_causa", rotulo: "Dispensa por justa causa" }
      - { valor: "pedido_demissao", rotulo: "Pedido de demissao" }
      - { valor: "rescisao_indireta", rotulo: "Pretende rescisao indireta" }
      - { valor: "acordo_484a", rotulo: "Acordo (art. 484-A)" }
      - { valor: "termino_contrato", rotulo: "Termino de contrato por prazo determinado" }
      - { valor: "sem_formalizacao", rotulo: "Simplesmente parou de ser chamado" }

  - id: verbas_pagas
    secao: rescisao
    texto: As verbas rescisorias foram pagas?
    tipo: escolha
    opcoes:
      - { valor: "integral", rotulo: "Integralmente" }
      - { valor: "parcial", rotulo: "Parcialmente" }
      - { valor: "nenhuma", rotulo: "Nao foram pagas" }

  - id: prazo_10_dias_cumprido
    secao: rescisao
    texto: O pagamento ocorreu em ate 10 dias do termino do contrato?
    tipo: bool
    mostrar_se:
      - - campo: verbas_pagas
          op: em
          valor: [integral, parcial]

  - id: fgts_depositado
    secao: rescisao
    texto: O FGTS foi depositado regularmente durante o contrato?
    tipo: escolha
    opcoes:
      - { valor: "integral", rotulo: "Sim, todos os meses" }
      - { valor: "parcial", rotulo: "Com falhas ou meses em aberto" }
      - { valor: "nenhum", rotulo: "Nunca houve deposito" }
      - { valor: "nao_sabe", rotulo: "Nao sabe informar" }
    ajuda: >-
      "Nao sabe" e resposta comum e nao e problema: o onus da prova e do
      empregador (Sumula 461). Requerer oficio a Caixa.

  - id: multa_40_paga
    secao: rescisao
    texto: A multa de 40% do FGTS foi paga?
    tipo: bool
    mostrar_se:
      - - campo: modalidade_saida
          op: em
          valor: [sem_justa_causa, rescisao_indireta, sem_formalizacao]

  - id: guias_seguro_desemprego
    secao: rescisao
    texto: As guias do seguro-desemprego foram entregues?
    tipo: bool
    mostrar_se:
      - - campo: modalidade_saida
          op: em
          valor: [sem_justa_causa, rescisao_indireta, sem_formalizacao]

  # --- danos ----------------------------------------------------------------
  - id: assedio_moral
    secao: danos
    texto: Sofreu assedio moral, humilhacao ou tratamento vexatorio?
    tipo: bool
    ajuda: >-
      Se sim, colher FATOS datados e nomes. Alegacao generica e a principal causa
      de improcedencia neste pedido.

  - id: dano_moral_situacoes
    secao: danos
    texto: Alguma destas situacoes ocorreu?
    tipo: multipla
    opcoes:
      - { valor: "revista_intima", rotulo: "Revista intima ou de pertences" }
      - { valor: "atraso_salarial", rotulo: "Atraso reiterado de salario" }
      - { valor: "exposicao_publica", rotulo: "Exposicao ou cobranca vexatoria em publico" }
      - { valor: "discriminacao", rotulo: "Discriminacao" }
      - { valor: "sem_banheiro", rotulo: "Falta de condicoes minimas de higiene" }
      - { valor: "acidente", rotulo: "Acidente de trabalho" }

  - id: afastamento_acidentario
    secao: danos
    texto: Houve afastamento pelo INSS por acidente de trabalho?
    tipo: bool
    ajuda: Afastamento superior a 15 dias com auxilio-doenca ACIDENTARIO (especie 91).

  - id: doenca_ocupacional
    secao: danos
    texto: Desenvolveu doenca relacionada ao trabalho?
    tipo: bool
    ajuda: LER/DORT, perda auditiva, transtorno mental, doenca de coluna.

  - id: gestante_na_dispensa
    secao: danos
    texto: A trabalhadora estava gravida na data da dispensa?
    tipo: bool
    ajuda: >-
      Vale mesmo se ela ou a empresa desconheciam a gravidez a epoca
      (Sumula 244, I, do TST).

  # --- processual -----------------------------------------------------------
  - id: data_ajuizamento
    secao: processual
    texto: Data do ajuizamento
    tipo: data
    ajuda: >-
      Em branco, assume hoje. Preencher quando a acao JA foi ajuizada: prescricao
      bienal e corte quinquenal contam dessa data, nao da data de hoje.

  - id: hipossuficiente
    secao: processual
    texto: O cliente declara insuficiencia de recursos para arcar com as custas?
    tipo: bool
    obrigatoria: true

  # --- fatos ----------------------------------------------------------------
  # A triagem descobre QUAIS pedidos cabem. A inicial precisa saber POR QUE, com
  # data, lugar e nome - e isso nenhuma pergunta de sim/nao entrega.
  #
  # Quase tudo aqui e pos-triagem (`mostrar_se_pedido`): so se pergunta o detalhe
  # do assedio depois que o dano moral se confirmou. Perguntar antes seria pedir
  # narrativa para um pedido que talvez nem exista, e afogar o comeco da
  # entrevista em campos de texto.
  #
  # LGPD: e aqui e na qualificacao que entra dado pessoal - inclusive dado de
  # saude, no bloco do acidente (art. 11 da Lei 13.709/2018). Tudo isso e gravado
  # em dados/casos.db, que nao vai para o git, nem para nuvem, nem para outra
  # maquina.

  - id: narrativa_fatos
    secao: fatos
    texto: Conte o caso em ordem cronologica
    tipo: texto_longo
    ajuda: >-
      Vira o corpo da historia dos fatos. Quem contratou, para fazer o que, como
      o trabalho corria, o que deu errado e como terminou. Data aproximada
      ("por volta de marco de 2022") vale mais do que adjetivo.
    exemplo: >-
      Admitido em 03/2021 como auxiliar de producao na unidade de Bayeux, sem
      registro em CTPS ate 09/2021. Cumpria de segunda a sabado...

  - id: fatos_jornada
    secao: fatos
    texto: Descreva a jornada realmente cumprida
    tipo: texto_longo
    mostrar_se_pedido:
      - horas_extras
      - intervalo_intrajornada
      - intervalo_interjornada
      - adicional_noturno
    ajuda: >-
      A inicial declara a jornada com entrada, saida, intervalo e dias da semana.
      Sem isso o pedido nao e certo nem determinado (art. 840, par. 1o), e a
      inversao do onus da prova nao supre o que a peca deixou de afirmar.
    exemplo: >-
      Segunda a sexta, 07h as 19h, com 20 minutos de intervalo. Dois sabados por
      mes, 07h as 13h. Sem folga compensatoria.

  - id: fatos_assedio
    secao: fatos
    texto: Descreva os episodios de assedio, humilhacao ou exposicao
    tipo: texto_longo
    mostrar_se_pedido:
      - dano_moral
    ajuda: >-
      Um episodio por linha: data (ou mes), local, quem praticou, quem
      presenciou. Alegacao generica e a principal causa de improcedencia deste
      pedido - esta pergunta existe para nao deixar isso acontecer.
    exemplo: >-
      15/03/2022, no refeitorio: o supervisor gritou que o reclamante "nao serve
      para nada" diante de cerca de dez colegas. Presenciaram Maria e Pedro.

  - id: fatos_acidente
    secao: fatos
    texto: Como ocorreu o acidente ou a doenca?
    tipo: texto_longo
    mostrar_se_pedido:
      - indenizacao_acidente
      - estabilidade_acidentaria
    ajuda: >-
      Data, atividade que executava, lesao, socorro, afastamento pelo INSS e
      sequela atual. Se houve CAT, dizer por quem e quando foi emitida - a
      omissao da empresa em emitir ja e fato a narrar.

  - id: fatos_justa_causa
    secao: fatos
    texto: Qual motivo a empresa alegou, e o que de fato ocorreu?
    tipo: texto_longo
    mostrar_se_pedido:
      - reversao_justa_causa
    ajuda: >-
      Registrar a versao da empresa delimita o que a inicial nega. O onus de
      provar a falta grave e dela, mas a peca precisa dizer qual falta se nega.

  - id: fatos_rescisao_indireta
    secao: fatos
    texto: Qual falta patronal justifica a rescisao indireta, e desde quando?
    tipo: texto_longo
    mostrar_se_pedido:
      - rescisao_indireta
    ajuda: >-
      Descrever a conduta e sua permanencia no tempo. Se houve reclamacao a
      empresa, ao sindicato, ao MPT ou a fiscalizacao, dizer quando e a quem.

  - id: fatos_paradigma
    secao: fatos
    texto: Quem e o paradigma?
    tipo: texto_longo
    mostrar_se_pedido:
      - equiparacao_salarial
    ajuda: >-
      O paradigma precisa ser NOMEADO na inicial, com funcao, diferenca salarial
      aproximada e periodo em que trabalharam juntos no mesmo estabelecimento.
    exemplo: >-
      Carlos Souza, operador II, mesmo setor, de 01/2021 a 08/2023, recebia
      cerca de R$ 800 a mais.

  - id: fatos_desvio
    secao: fatos
    texto: Quais atribuicoes exercia alem das contratadas, e desde quando?
    tipo: texto_longo
    linhas: 3
    mostrar_se_pedido:
      - desvio_acumulo_funcao

  # --- qualificacao ---------------------------------------------------------
  # Ultima secao de proposito. Nada aqui muda a triagem: sao os dados que a peca
  # exige (art. 840, par. 1o, da CLT; art. 319 do CPC) e que so fazem falta
  # depois que o caso se confirmou. Pedir CPF e endereco antes de saber se ha
  # acao e por burocracia na frente do trabalho.
  #
  # A profissao da qualificacao nao se repete aqui: sai de `funcao`, na primeira
  # secao. Dois campos para a mesma coisa divergem no primeiro caso em que
  # alguem corrigir so um deles.

  - id: reclamante_nome
    secao: qualificacao
    texto: Nome completo do reclamante
    tipo: texto
    obrigatoria: true

  - id: reclamante_nacionalidade
    secao: qualificacao
    texto: Nacionalidade
    tipo: texto
    exemplo: brasileiro

  - id: reclamante_estado_civil
    secao: qualificacao
    texto: Estado civil
    tipo: escolha
    opcoes:
      - { valor: "solteiro", rotulo: "Solteiro(a)" }
      - { valor: "casado", rotulo: "Casado(a)" }
      - { valor: "uniao_estavel", rotulo: "Em uniao estavel" }
      - { valor: "divorciado", rotulo: "Divorciado(a)" }
      - { valor: "separado", rotulo: "Separado(a) judicialmente" }
      - { valor: "viuvo", rotulo: "Viuvo(a)" }
    ajuda: >-
      O art. 319, II, do CPC pede tambem a existencia de uniao estavel, por isso
      ela aparece como estado proprio e nao dentro de "solteiro".

  - id: reclamante_cpf
    secao: qualificacao
    texto: CPF
    tipo: texto
    obrigatoria: true
    exemplo: 000.000.000-00

  - id: reclamante_rg
    secao: qualificacao
    texto: RG e orgao emissor
    tipo: texto
    exemplo: 0.000.000 SSP/PB

  - id: reclamante_ctps
    secao: qualificacao
    texto: CTPS (numero e serie) ou numero da carteira digital
    tipo: texto
    exemplo: 0000000 serie 000-PB

  - id: reclamante_pis
    secao: qualificacao
    texto: PIS/PASEP
    tipo: texto
    ajuda: Necessario para o oficio a Caixa quando ha FGTS em aberto.

  - id: reclamante_endereco
    secao: qualificacao
    texto: Endereco completo do reclamante
    tipo: texto_longo
    linhas: 2
    obrigatoria: true
    exemplo: >-
      Rua Exemplo, 123, apto 4, bairro Centro, Joao Pessoa/PB, CEP 58000-000

  - id: reclamante_email
    secao: qualificacao
    texto: Endereco eletronico
    tipo: texto
    ajuda: >-
      Exigido pelo art. 319, II, do CPC. Se nao houver, a peca declara que nao
      possui - em branco aqui significa exatamente isso.

  - id: reclamante_telefone
    secao: qualificacao
    texto: Telefone
    tipo: texto

  - id: reclamada_razao_social
    secao: qualificacao
    texto: Razao social da reclamada
    tipo: texto
    obrigatoria: true
    ajuda: A razao social do CNPJ, nao o nome de fachada.

  - id: reclamada_cnpj
    secao: qualificacao
    texto: CNPJ
    tipo: texto
    exemplo: 00.000.000/0001-00

  - id: reclamada_endereco
    secao: qualificacao
    texto: Endereco da reclamada para citacao
    tipo: texto_longo
    linhas: 2
    obrigatoria: true
    ajuda: >-
      Endereco onde a citacao efetivamente chega. Se a empresa esta baixada, vale
      o endereco dos socios - o processo para na citacao frustrada.

  - id: reclamada_outras
    secao: qualificacao
    texto: Outras pessoas a incluir no polo passivo
    tipo: texto_longo
    linhas: 3
    ajuda: >-
      Grupo economico, sucessao, socios, tomador de servicos. Incluir na inicial
      e barato; incluir na execucao custa anos.
